  <text x="910" y="418" font-size="11" fill="#A39E93">一键复制 /compact · target:new</text>

  <!-- Vertical dashed link from Daemon to Storage Isolation -->
  <line x1="721" y1="452" x2="721" y2="473" stroke="#7B766C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>
  <line x1="435" y1="452" x2="435" y2="473" stroke="#7B766C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>

  <!-- Bottom Strip -->
  <rect x="24" y="478" width="1112" height="108" rx="14" fill="#181714" stroke="#38342E" stroke-dasharray="5 4"/>
  <text x="42" y="502" font-size="12.5" font-weight="700" fill="#E5896B">安全边界、极小常驻提示词占用与自动化发布流水线</text>

  <rect x="40" y="514" width="350" height="58" rx="9" fill="#1C1B18" stroke="#302D28"/>
  <text x="56" y="537" font-size="13" font-weight="650" fill="#F4F1EA">可写状态严格隔离于 ${PLUGIN_DATA}</text>
  <text x="56" y="557" font-size="11" fill="#A39E93">一次性防重放 relay_grants.json + 可选索引缓存</text>

  <rect x="406" y="514" width="348" height="58" rx="9" fill="#1C1B18" stroke="#302D28"/>
  <text x="422" y="537" font-size="13" font-weight="650" fill="#F4F1EA">极简 Agent 注入占用</text>
  <text x="422" y="557" font-size="11" fill="#A39E93">rules/AGENTS.md（&lt;300 B）+ 按需加载 SKILL.md</text>

  <rect x="770" y="514" width="350" height="58" rx="9" fill="#1C1B18" stroke="#302D28"/>
