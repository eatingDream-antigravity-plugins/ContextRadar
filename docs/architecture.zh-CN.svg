<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 610" width="1160" height="610" role="img" aria-labelledby="title desc" font-family="-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="title">Context Radar MCP 架构图</title>
  <desc id="desc">只读访问 Antigravity SQLite 与会话日志，经由原生 Rust 遥测引擎完成三分类冷缓存归因、预算门禁、保前缀切片提炼与 SWR 内存预热，通过 MCP 守护进程与执行守卫驱动暗色优先的 MCP App 面板。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#D97757"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#7B766C"/>
    </marker>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1160" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171613"/>
      <stop offset="100%" stop-color="#141311"/>
    </linearGradient>
  </defs>

  <!-- Outer Canvas -->
  <rect x="0.5" y="0.5" width="1159" height="609" rx="18" fill="url(#bg-grad)" stroke="#2E2B26"/>

  <!-- Header -->
  <text x="580" y="37" text-anchor="middle" font-size="18.5" font-weight="700" fill="#F4F1EA">Context Radar MCP · 原生 Rust 上下文遥测、保前缀提炼与硬门禁接力架构</text>
  <text x="580" y="58" text-anchor="middle" font-size="12" fill="#A39E93">单文件原生二进制 · 零外部联网 · 宿主 SQLite 严格只读 · &lt;0.5 ms SWR 秒开 · 状态隔离于 ${PLUGIN_DATA}</text>

  <!-- Column 1: 宿主数据源（只读） -->
  <rect x="24" y="80" width="250" height="372" rx="14" fill="#181A1F" stroke="#6B94D6" stroke-opacity="0.38"/>
  <text x="149" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8BB0EA">1 · 宿主数据源（只读）</text>

  <rect x="36" y="124" width="226" height="68" rx="10" fill="#1C1B18" stroke="#302D28"/>
  <rect x="36" y="124" width="4.5" height="68" rx="2.25" fill="#6B94D6"/>
  <text x="52" y="150" font-size="13.5" font-weight="650" fill="#F4F1EA">Antigravity SQLite</text>
  <text x="52" y="172" font-size="11" fill="#A39E93">READ_ONLY · PRAGMA query_only</text>

  <rect x="36" y="206" width="226" height="68" rx="10" fill="#1C1B18" stroke="#302D28"/>
  <rect x="36" y="206" width="4.5" height="68" rx="2.25" fill="#6B94D6"/>
  <text x="52" y="232" font-size="13.5" font-weight="650" fill="#F4F1EA">会话日志与检查点</text>
  <text x="52" y="254" font-size="11" fill="#A39E93">256 KiB 逆向扫描 CHECKPOINT</text>

  <rect x="36" y="288" width="226" height="68" rx="10" fill="#1C1B18" stroke="#302D28"/>
  <rect x="36" y="288" width="4.5" height="68" rx="2.25" fill="#6B94D6"/>
  <text x="52" y="314" font-size="13.5" font-weight="650" fill="#F4F1EA">Protobuf 线速游标</text>
  <text x="52" y="336" font-size="11" fill="#A39E93">零拷贝提前退出 · 模型/步解析</text>

  <rect x="36" y="370" width="226" height="68" rx="10" fill="#1C1B18" stroke="#302D28"/>
  <rect x="36" y="370" width="4.5" height="68" rx="2.25" fill="#6B94D6"/>
  <text x="52" y="396" font-size="13.5" font-weight="650" fill="#F4F1EA">可选 settings.json</text>
  <text x="52" y="418" font-size="11" fill="#A39E93">模型费率 · 汇率 · 预算档位 · 守卫</text>

  <!-- Connector 1 -> 2 -->
  <line x1="278" y1="266" x2="305" y2="266" stroke="#D97757" stroke-width="2" marker-end="url(#arrow)"/>

