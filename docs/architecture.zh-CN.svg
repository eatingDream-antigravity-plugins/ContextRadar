  <rect x="322" y="206" width="226" height="68" rx="10" fill="#1C1B18" stroke="#302D28"/>
  <rect x="322" y="206" width="4.5" height="68" rx="2.25" fill="#D97757"/>
  <text x="338" y="232" font-size="13.5" font-weight="650" fill="#F4F1EA">预算分档与回本门禁</text>
  <text x="338" y="254" font-size="11" fill="#A39E93">模型 × 思考档位 · 冷却与回本轮数</text>

  <rect x="322" y="288" width="226" height="68" rx="10" fill="#1C1B18" stroke="#302D28"/>
  <rect x="322" y="288" width="4.5" height="68" rx="2.25" fill="#D97757"/>
  <text x="338" y="314" font-size="13.5" font-weight="650" fill="#F4F1EA">保前缀切片提炼器</text>
  <text x="338" y="336" font-size="11" fill="#A39E93">定位膨胀热点 → 写入 scratch/ 摘要</text>

  <rect x="322" y="370" width="226" height="68" rx="10" fill="#1C1B18" stroke="#302D28"/>
  <rect x="322" y="370" width="4.5" height="68" rx="2.25" fill="#D97757"/>
  <text x="338" y="396" font-size="13.5" font-weight="650" fill="#F4F1EA">启动预热 + SWR 缓存</text>
  <text x="338" y="418" font-size="11" fill="#A39E93">&lt;0.5 ms 内存命中 · 单飞异步刷新</text>

  <!-- Connector 2 -> 3 -->
  <line x1="564" y1="266" x2="591" y2="266" stroke="#D97757" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 3: MCP 守护进程与执行守卫 -->
  <rect x="596" y="80" width="250" height="372" rx="14" fill="#1E1C16" stroke="#D4A14B" stroke-opacity="0.42"/>
  <text x="721" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E3B667">3 · MCP 守护进程与守卫</text>

  <rect x="608" y="124" width="226" height="68" rx="10" fill="#1C1B18" stroke="#302D28"/>
  <rect x="608" y="124" width="4.5" height="68" rx="2.25" fill="#D4A14B"/>
  <text x="624" y="150" font-size="13.5" font-weight="650" fill="#F4F1EA">5 个模型+面板工具</text>
  <text x="624" y="172" font-size="11" fill="#A39E93">overview · turns · hotspots · handoff</text>

  <rect x="608" y="206" width="226" height="68" rx="10" fill="#1C1B18" stroke="#302D28"/>
  <rect x="608" y="206" width="4.5" height="68" rx="2.25" fill="#D4A14B"/>
  <text x="624" y="232" font-size="13.5" font-weight="650" fill="#F4F1EA">面板私有状态工具</text>
  <text x="624" y="254" font-size="11" fill="#A39E93">ui_action · visibility: ["app"]</text>

  <rect x="608" y="288" width="226" height="68" rx="10" fill="#1C1B18" stroke="#302D28"/>
  <rect x="608" y="288" width="4.5" height="68" rx="2.25" fill="#D4A14B"/>
  <text x="624" y="314" font-size="13.5" font-weight="650" fill="#F4F1EA">guard boot (SessionStart)</text>
  <text x="624" y="336" font-size="11" fill="#A39E93">工作区受限摘要 · 防符号链接越界</text>

  <rect x="608" y="370" width="226" height="68" rx="10" fill="#1C1B18" stroke="#302D28"/>
  <rect x="608" y="370" width="4.5" height="68" rx="2.25" fill="#D4A14B"/>
  <text x="624" y="396" font-size="13.5" font-weight="650" fill="#F4F1EA">guard exec (PreToolUse)</text>
  <text x="624" y="418" font-size="11" fill="#A39E93">同步等待保底 · 自动豁免常驻进程</text>

  <!-- Connector 3 -> 4 -->
  <line x1="850" y1="266" x2="877" y2="266" stroke="#D97757" stroke-width="2" marker-end="url(#arrow)"/>

