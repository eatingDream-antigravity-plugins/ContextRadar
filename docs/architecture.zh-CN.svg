  <rect x="310" y="80" width="250" height="372" rx="14" fill="#1F1916" stroke="#D97757" stroke-opacity="0.45"/>
  <text x="435" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E5896B">2 · Rust 遥测与决策引擎</text>

