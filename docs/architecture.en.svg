  <text x="56" y="557" font-size="11" fill="#8A94A8">Single-use relay_grants.json + optional index cache</text>

  <rect x="406" y="514" width="348" height="58" rx="9" fill="#12151E" stroke="#252B3D"/>
  <text x="422" y="537" font-size="13" font-weight="650" fill="#F2F4F8">Minimal Always-On Footprint</text>
  <text x="422" y="557" font-size="11" fill="#8A94A8">rules/AGENTS.md (&lt;300 B) + on-demand SKILL.md</text>

  <rect x="770" y="514" width="350" height="58" rx="9" fill="#12151E" stroke="#252B3D"/>
  <text x="786" y="537" font-size="13" font-weight="650" fill="#F2F4F8">Reproducible Cross-Platform CI</text>
  <text x="786" y="557" font-size="11" fill="#8A94A8">SHA-pinned Actions · gitleaks · --remap-path-prefix</text>
