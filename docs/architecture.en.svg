  <text x="721" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FCD34D">3 · MCP Daemon &amp; Guards</text>

  <rect x="608" y="124" width="226" height="68" rx="10" fill="#12151E" stroke="#252B3D"/>
