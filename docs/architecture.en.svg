  <text x="338" y="254" font-size="11" fill="#8A94A8">Model × effort · break-even turns</text>

  <rect x="322" y="288" width="226" height="68" rx="10" fill="#12151E" stroke="#252B3D"/>
  <rect x="322" y="288" width="4.5" height="68" rx="2.25" fill="#6895FF"/>
  <text x="338" y="314" font-size="13.5" font-weight="650" fill="#F2F4F8">Prefix-Safe Distiller</text>
  <text x="338" y="336" font-size="11" fill="#8A94A8">Hotspot slices → scratch/ digest</text>

  <rect x="322" y="370" width="226" height="68" rx="10" fill="#12151E" stroke="#252B3D"/>
  <rect x="322" y="370" width="4.5" height="68" rx="2.25" fill="#6895FF"/>
  <text x="338" y="396" font-size="13.5" font-weight="650" fill="#F2F4F8">Pre-Warm + SWR Cache</text>
  <text x="338" y="418" font-size="11" fill="#8A94A8">&lt;0.5 ms RAM hit · single-flight</text>

