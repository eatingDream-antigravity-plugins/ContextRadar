<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 610" width="1160" height="610" role="img" aria-labelledby="title desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="title">Context Radar MCP Architecture</title>
  <desc id="desc">Read-only Antigravity SQLite and conversation journals feed a native Rust telemetry engine with 3-way cold-cache attribution, budget gating, slice distillation, and SWR caching, served over stdio MCP and execution guards to a dark-first Lucid Indigo MCP App UI.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#6895FF"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#6E788E"/>
    </marker>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1160" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1118"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>
  </defs>

  <!-- Outer Canvas -->
  <rect x="0.5" y="0.5" width="1159" height="609" rx="18" fill="url(#bg-grad)" stroke="#23293A"/>

  <!-- Header -->
  <text x="580" y="37" text-anchor="middle" font-size="18.5" font-weight="700" fill="#F2F4F8" letter-spacing="-0.2">Context Radar MCP · Native Rust Telemetry, Distillation &amp; Gated Handoff Architecture</text>
  <text x="580" y="58" text-anchor="middle" font-size="12" fill="#8A94A8">Single static-style binary · Zero external network · Strict read-only host SQLite · &lt;0.5 ms SWR boot · Isolated ${PLUGIN_DATA}</text>

  <!-- Column 1: Host Sources (Read-Only) -->
  <rect x="24" y="80" width="250" height="372" rx="14" fill="#121622" stroke="#6895FF" stroke-opacity="0.38"/>
  <text x="149" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#93B4FF">1 · Host Sources (Read-Only)</text>

  <rect x="36" y="124" width="226" height="68" rx="10" fill="#12151E" stroke="#252B3D"/>
  <rect x="36" y="124" width="4.5" height="68" rx="2.25" fill="#6895FF"/>
  <text x="52" y="150" font-size="13.5" font-weight="650" fill="#F2F4F8">Antigravity SQLite</text>
  <text x="52" y="172" font-size="11" fill="#8A94A8">READ_ONLY · PRAGMA query_only</text>

  <rect x="36" y="206" width="226" height="68" rx="10" fill="#12151E" stroke="#252B3D"/>
  <rect x="36" y="206" width="4.5" height="68" rx="2.25" fill="#6895FF"/>
  <text x="52" y="232" font-size="13.5" font-weight="650" fill="#F2F4F8">Session Journals</text>
  <text x="52" y="254" font-size="11" fill="#8A94A8">256 KiB reverse CHECKPOINT scan</text>

  <rect x="36" y="288" width="226" height="68" rx="10" fill="#12151E" stroke="#252B3D"/>
  <rect x="36" y="288" width="4.5" height="68" rx="2.25" fill="#6895FF"/>
  <text x="52" y="314" font-size="13.5" font-weight="650" fill="#F2F4F8">Protobuf Wire Cursor</text>
  <text x="52" y="336" font-size="11" fill="#8A94A8">Zero-copy early-exit step decode</text>

  <rect x="36" y="370" width="226" height="68" rx="10" fill="#12151E" stroke="#252B3D"/>
  <rect x="36" y="370" width="4.5" height="68" rx="2.25" fill="#6895FF"/>
  <text x="52" y="396" font-size="13.5" font-weight="650" fill="#F2F4F8">Optional settings.json</text>
  <text x="52" y="418" font-size="11" fill="#8A94A8">Pricing · FX · budget tiers · rules</text>

  <!-- Connector 1 -> 2 -->
  <line x1="278" y1="266" x2="305" y2="266" stroke="#6895FF" stroke-width="2" marker-end="url(#arrow)"/>

