  <text x="624" y="254" font-size="11" fill="#8A94A8">ui_action · visibility: ["app"]</text>

  <rect x="608" y="288" width="226" height="68" rx="10" fill="#12151E" stroke="#252B3D"/>
  <rect x="608" y="288" width="4.5" height="68" rx="2.25" fill="#FBBF24"/>
  <text x="624" y="314" font-size="13.5" font-weight="650" fill="#F2F4F8">guard boot (SessionStart)</text>
  <text x="624" y="336" font-size="11" fill="#8A94A8">Bounded hints · symlink-safe</text>

  <rect x="608" y="370" width="226" height="68" rx="10" fill="#12151E" stroke="#252B3D"/>
  <rect x="608" y="370" width="4.5" height="68" rx="2.25" fill="#FBBF24"/>
  <text x="624" y="396" font-size="13.5" font-weight="650" fill="#F2F4F8">guard exec (PreToolUse)</text>
  <text x="624" y="418" font-size="11" fill="#8A94A8">Sync wait floor · daemon-exempt</text>

  <!-- Connector 3 -> 4 -->
  <line x1="850" y1="266" x2="877" y2="266" stroke="#6895FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 4: Lucid Indigo MCP App UI -->
  <rect x="882" y="80" width="254" height="372" rx="14" fill="#101B1B" stroke="#34D399" stroke-opacity="0.42"/>
  <text x="1009" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6EE7B7">4 · Lucid Indigo MCP App UI</text>

  <rect x="894" y="124" width="230" height="68" rx="10" fill="#12151E" stroke="#252B3D"/>
  <rect x="894" y="124" width="4.5" height="68" rx="2.25" fill="#34D399"/>
  <text x="910" y="150" font-size="13.5" font-weight="650" fill="#F2F4F8">&lt;64 KiB Single-File HTML</text>
