  <rect x="310" y="80" width="250" height="372" rx="14" fill="#131726" stroke="#6895FF" stroke-opacity="0.45"/>
  <text x="435" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#82A8FF">2 · Rust Telemetry Engine</text>

  <rect x="322" y="124" width="226" height="68" rx="10" fill="#12151E" stroke="#252B3D"/>
