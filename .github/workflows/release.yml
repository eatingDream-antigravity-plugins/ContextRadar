name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload (defaults to v<plugin.json version>)"
        required: false
        type: string
      platforms:
        description: "Target platforms to build"
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - linux

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Ensure GitHub Release exists
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Resolve release tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$(node -p "require('./plugin.json').version")"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "error: invalid release tag '$TAG' (expected vX.Y.Z)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  build-linux:
    name: Build (x86_64-unknown-linux-gnu)
    needs: prepare-release
    if: ${{ inputs.platforms != 'macos' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare-release.outputs.tag }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Add Rust target
        run: rustup target add "${TARGET}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: linux-x86_64
      - name: Pack and verify MCP App panel
        run: |
          npm --prefix panel ci --ignore-scripts
          npm --prefix panel run typecheck
          npm --prefix panel run build
          npm --prefix panel test
      - name: Run Rust test suite
        run: cargo test --locked
      - name: Build, verify, and stage Linux tarball
        run: |
          RUSTFLAGS="--remap-path-prefix=${HOME}=/build --remap-path-prefix=${PWD}=/src" cargo build --release --locked --target "${TARGET}"
          bin="target/${TARGET}/release/context-radar-mcp"
          if strings "$bin" | grep -F -e "${HOME}" -e "${PWD}" >/dev/null 2>&1; then
            echo "error: runner path leaked into release binary" >&2
            exit 1
          fi
          STAGE="${RUNNER_TEMP}/stage-${TARGET}"
          OUT="${RUNNER_TEMP}/artifacts-${TARGET}"
          rm -rf "$STAGE" "$OUT"
          mkdir -p "$STAGE/bin" "$STAGE/panel/dist" "$STAGE/rules" "$STAGE/skills/context-radar" "$STAGE/assets" "$STAGE/docs" "$OUT"
          install -m 0755 "$bin" "$STAGE/bin/context-radar-mcp"
          cp panel/dist/panel.html "$STAGE/panel/dist/panel.html"
          cp plugin.json mcp_config.json hooks.json LICENSE README.md llms.txt settings.example.json settings.schema.json "$STAGE/"
          cp rules/AGENTS.md "$STAGE/rules/AGENTS.md"
          cp skills/context-radar/SKILL.md "$STAGE/skills/context-radar/SKILL.md"
          cp assets/logo.svg "$STAGE/assets/logo.svg"
          cp docs/ai-guide.md "$STAGE/docs/ai-guide.md"
          ARCHIVE="context-radar-mcp-${TAG}-${TARGET}.tar.gz"
          tar -C "$STAGE" -czf "${OUT}/${ARCHIVE}" .
          (cd "$OUT" && sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256" && cat "${ARCHIVE}.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ env.TARGET }}
          path: ${{ runner.temp }}/artifacts-${{ env.TARGET }}/*
          if-no-files-found: error

  build-macos:
    name: Build (macOS arm64 + x86_64)
    needs: prepare-release
    if: ${{ inputs.platforms != 'linux' }}
    runs-on: macos-15-intel
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare-release.outputs.tag }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Add macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: macos-universal
      - name: Pack and verify MCP App panel
        run: |
          npm --prefix panel ci --ignore-scripts
          npm --prefix panel run typecheck
          npm --prefix panel run build
          npm --prefix panel test
      - name: Run Rust test suite
        run: cargo test --locked
      - name: Build, verify, and stage macOS tarballs
        run: |
          OUT="${RUNNER_TEMP}/artifacts-macos"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin; do
            echo "=== Building ${TARGET} ==="
            RUSTFLAGS="--remap-path-prefix=${HOME}=/build --remap-path-prefix=${PWD}=/src" cargo build --release --locked --target "${TARGET}"
            bin="target/${TARGET}/release/context-radar-mcp"
            if strings "$bin" | grep -F -e "${HOME}" -e "${PWD}" >/dev/null 2>&1; then
              echo "error: runner path leaked into release binary (${TARGET})" >&2
              exit 1
            fi
            STAGE="${RUNNER_TEMP}/stage-${TARGET}"
            rm -rf "$STAGE"
            mkdir -p "$STAGE/bin" "$STAGE/panel/dist" "$STAGE/rules" "$STAGE/skills/context-radar" "$STAGE/assets" "$STAGE/docs"
            install -m 0755 "$bin" "$STAGE/bin/context-radar-mcp"
            cp panel/dist/panel.html "$STAGE/panel/dist/panel.html"
            cp plugin.json mcp_config.json hooks.json LICENSE README.md llms.txt settings.example.json settings.schema.json "$STAGE/"
            cp rules/AGENTS.md "$STAGE/rules/AGENTS.md"
            cp skills/context-radar/SKILL.md "$STAGE/skills/context-radar/SKILL.md"
            cp assets/logo.svg "$STAGE/assets/logo.svg"
            cp docs/ai-guide.md "$STAGE/docs/ai-guide.md"
            ARCHIVE="context-radar-mcp-${TAG}-${TARGET}.tar.gz"
            COPYFILE_DISABLE=1 tar -C "$STAGE" -czf "${OUT}/${ARCHIVE}" .
            (cd "$OUT" && shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256" && cat "${ARCHIVE}.sha256")
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-macos
          path: ${{ runner.temp }}/artifacts-macos/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release assets
    needs: [prepare-release, build-linux, build-macos]
    if: >-
      ${{ always() && needs.prepare-release.result == 'success' &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (needs.build-linux.result == 'success' || needs.build-macos.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare-release.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Upload release tarballs and checksums
        run: |
          ls -la dist-artifacts
          gh release upload "$TAG" -R "$REPO" dist-artifacts/*.tar.gz dist-artifacts/*.tar.gz.sha256 --clobber
