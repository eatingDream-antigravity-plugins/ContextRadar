name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload (defaults to v<plugin.json version>)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare-release:
    name: Ensure GitHub Release exists
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - name: Resolve release tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$(node -p "require('./plugin.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  build-and-upload:
    name: Build (${{ matrix.target }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Pack and verify MCP App panel
        run: |
          npm --prefix "${RUNNER_TEMP}/esbuild" install --no-save esbuild
          ESBUILD_PATH="${RUNNER_TEMP}/esbuild/node_modules/esbuild" node panel/pack.mjs
          node --test panel/panel.test.mjs
      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          RUSTFLAGS="--remap-path-prefix=$HOME=/build" cargo build --release --locked --target "${{ matrix.target }}"
      - name: Assemble Antigravity plugin tarball & SHA-256
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          STAGE="${RUNNER_TEMP}/stage-${TARGET}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/bin" "$STAGE/panel/dist" "$STAGE/rules" "$STAGE/skills/context-radar" "$STAGE/assets"

          install -m 0755 "target/${TARGET}/release/context-radar-mcp" "$STAGE/bin/context-radar-mcp"
          cp panel/dist/panel.html "$STAGE/panel/dist/panel.html"
          cp plugin.json mcp_config.json hooks.json LICENSE README.md settings.example.json settings.schema.json "$STAGE/"
          cp rules/AGENTS.md "$STAGE/rules/AGENTS.md"
          cp skills/context-radar/SKILL.md "$STAGE/skills/context-radar/SKILL.md"
          cp assets/logo.svg "$STAGE/assets/logo.svg"

          ARCHIVE="context-radar-mcp-${TAG}-${TARGET}.tar.gz"
          tar -C "$STAGE" -czf "$ARCHIVE" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi
          ls -lh "$ARCHIVE" "${ARCHIVE}.sha256"
          cat "${ARCHIVE}.sha256"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          ARCHIVE="context-radar-mcp-${TAG}-${TARGET}.tar.gz"
          gh release upload "$TAG" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber
